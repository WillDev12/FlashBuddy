name: Release — FlashBuddy Extras

on:
  push:
    tags:
      - 'ext-v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Extract release notes from CHANGELOG
        run: awk '/^## ext-\[/{if(p) exit; p=1; next} p' CHANGELOG.md > release_notes.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          files: |
            dist/extension/FlashBuddy-extension.zip
